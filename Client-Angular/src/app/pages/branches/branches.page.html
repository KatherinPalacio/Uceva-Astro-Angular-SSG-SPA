<h1>Sucursales</h1>
<hr>

<table class="table table-striped border">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Ciudad</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let branch of branches">
      <td>{{ branch.id }}</td>
      <td>{{ branch.name }}</td>
      <td>{{ branch.city }}</td>
      <td>{{ branch.status }}</td>
    </tr>
  </tbody>
</table>
